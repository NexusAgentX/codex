name: nexus-release

on:
  workflow_dispatch:
  push:
    tags:
      - "nexus-v*"

concurrency:
  group: nexus-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux-x64:
    name: Build Linux x86_64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      nexus_version: ${{ steps.metadata.outputs.nexus_version }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      TARGET: x86_64-unknown-linux-musl
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl: "1"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/Cargo.toml | head -1)"
          if [[ -z "$version" || "$version" == "0.0.0" ]]; then
            echo "Expected a versioned upstream release base, got '${version}'." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_regex="^nexus-v${version//./\\.}\\.[1-9][0-9]*$"
            if [[ ! "${GITHUB_REF_NAME}" =~ $tag_regex ]]; then
              echo "Tag '${GITHUB_REF_NAME}' must match nexus-v${version}.<build>." >&2
              exit 1
            fi
            build_number="${GITHUB_REF_NAME##*.}"
          else
            build_number="0"
          fi

          nexus_version="${version}-nexus.${build_number}"
          echo "CODEX_CLI_VERSION_OVERRIDE=${nexus_version}" >> "$GITHUB_ENV"
          echo "NEXUS_VERSION=${nexus_version}" >> "$GITHUB_ENV"
          echo "nexus_version=${nexus_version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Test Nexus npm packaging
        run: python3 -m unittest discover -s codex-cli/scripts -p 'test_build_npm_package.py'

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        shell: bash
        run: bash .github/scripts/install-musl-build-tools.sh

      - name: Build bundled bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          # Stable upstream tags update Cargo.toml without rewriting local
          # workspace package versions in Cargo.lock. Let Cargo refresh only
          # those entries while retaining the locked third-party resolutions.
          cargo build \
            --manifest-path codex-rs/Cargo.toml \
            --target "$TARGET" \
            --release \
            --bin bwrap

          bwrap_bin="$CARGO_TARGET_DIR/$TARGET/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_bin"
          digest="$(sha256sum "$bwrap_bin" | awk '{print $1}')"
          echo "BWRAP_BIN=${bwrap_bin}" >> "$GITHUB_ENV"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Build canonical Codex package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/codex-package-$TARGET"
          archive="dist/codex-package-$TARGET.tar.gz"
          mkdir -p dist

          python3 scripts/build_codex_package.py \
            --target "$TARGET" \
            --variant codex \
            --version "$NEXUS_VERSION" \
            --cargo-profile release \
            --bwrap-bin "$BWRAP_BIN" \
            --package-dir "$package_dir" \
            --archive-output "$archive" \
            --force

          version_output="$("$package_dir/bin/codex" --version)"
          if [[ "${version_output##* }" != "$NEXUS_VERSION" ]]; then
            echo "Unexpected Codex version output: ${version_output}" >&2
            exit 1
          fi
          jq -e --arg version "$NEXUS_VERSION" \
            '.version == $version' "$package_dir/codex-package.json" >/dev/null

          vendor_target="$RUNNER_TEMP/npm-vendor/$TARGET"
          mkdir -p "$vendor_target" dist/npm
          cp -a "$package_dir/." "$vendor_target/"

          python3 codex-cli/scripts/build_npm_package.py \
            --package codex-linux-x64 \
            --release-version "$NEXUS_VERSION" \
            --vendor-src "$RUNNER_TEMP/npm-vendor" \
            --pack-output "dist/npm/codex-npm-linux-x64-$NEXUS_VERSION.tgz"

          python3 codex-cli/scripts/build_npm_package.py \
            --package codex \
            --release-version "$NEXUS_VERSION" \
            --pack-output "dist/npm/codex-npm-$NEXUS_VERSION.tgz"

      - name: Upload package artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-package-x86_64-unknown-linux-musl
          path: dist/codex-package-x86_64-unknown-linux-musl.tar.gz
          if-no-files-found: error

      - name: Upload npm tarballs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nexus-npm-tarballs
          path: dist/npm/*.tgz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/nexus-v')
    needs: build-linux-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-package-x86_64-unknown-linux-musl
          path: release

      - name: Download npm tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-npm-tarballs
          path: release

      - name: Generate checksum manifest
        shell: bash
        working-directory: release
        run: sha256sum *.tar.gz *.tgz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: Nexus Codex ${{ github.ref_name }}
          body: |
            Unofficial NexusAgentX build based on OpenAI Codex ${{ needs.build-linux-x64.outputs.version }}.

            Source commit: `${{ github.sha }}`
            Initial target: Linux x86_64 (musl)
            Nexus version: `${{ needs.build-linux-x64.outputs.nexus_version }}`

            The attached npm tarballs are validation artifacts. This workflow does not publish them to npmjs.com.
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true
