name: Nexus package tests

on:
  workflow_dispatch:
  push:
    branches:
      - nexus
    paths:
      - ".github/workflows/nexus-package-tests.yml"
      - "codex-cli/**"
  pull_request:
    paths:
      - ".github/workflows/nexus-package-tests.yml"
      - "codex-cli/**"

concurrency:
  group: nexus-package-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test npm packaging (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: python -m unittest discover -s codex-cli/scripts -p 'test_*.py'
